<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía interactiva · AWS Certified Cloud Practitioner (CLF-C02)</title>
<link rel="stylesheet" href="shared/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="auth-overlay" id="authOverlay">
  <div class="auth-box card">
    <button class="cerrar" id="authClose" title="Cerrar" aria-label="Cerrar">✕</button>
    <h1>Sincroniza tu progreso</h1>
    <p class="lead" id="authLead">Ingresa tu correo para guardar tu progreso actual y continuar desde cualquier dispositivo.</p>
    <form id="loginForm">
      <input class="field" id="loginEmail" type="email" placeholder="Correo electrónico" autocomplete="email" required>
      <button class="btn" type="submit" id="loginBtn">Enviar código</button>
      <p class="note error" id="loginError"></p>
    </form>
    <form id="otpForm" style="display:none">
      <input class="field" id="otpCode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="Código de acceso" autocomplete="one-time-code" required>
      <button class="btn" type="submit" id="otpBtn">Verificar código</button>
      <p class="note error" id="otpError"></p>
      <p class="note" id="otpResendNote">¿No llegó? <a href="#" id="otpResend">Reenviar código</a> · <a href="#" id="otpBack">Cambiar correo</a></p>
    </form>
    <p class="note"><a href="#" id="authSkip">Seguir sin cuenta</a> — tu progreso se guarda solo en este navegador.</p>
  </div>
</div>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="logo" id="examLogo">AWS</span>
      <h1 id="examTitulo">Guía interactiva</h1>
      <span class="sub" id="miniProgress">Avance: 0%</span>
      <span class="sub" id="userInfo"></span>
      <span id="examSwitch"></span>
      <button class="btn ghost" id="loginHeaderBtn" style="display:none;margin-left:8px" onclick="abrirLogin()">Iniciar sesión</button>
      <button class="btn ghost" id="logoutBtn" style="display:none;margin-left:8px" onclick="cerrarSesion()">Salir</button>
    </div>
    <div class="tabs-wrap" id="tabsWrap">
      <nav class="tabs" id="tabs">
        <button data-tab="inicio" class="active">Inicio</button>
        <button data-tab="repaso">Repaso por dominio</button>
        <button data-tab="preguntas">Banco de preguntas</button>
        <button data-tab="casos">Casos de estudio</button>
        <button data-tab="simulacro">Simulacro</button>
        <button data-tab="progreso">Mi progreso</button>
        <button data-tab="flashcards">Flashcards</button>
        <button data-tab="glosario">Glosario</button>
        <button data-tab="servicios">Servicios AWS</button>
        <button data-tab="comparador">Comparador</button>
      </nav>
    </div>
  </div>
</header>

<main>
  <!-- INICIO -->
  <section class="panel active" id="panel-inicio"></section>
  <!-- REPASO -->
  <section class="panel" id="panel-repaso"></section>
  <!-- PREGUNTAS -->
  <section class="panel" id="panel-preguntas"></section>
  <!-- CASOS DE ESTUDIO -->
  <section class="panel" id="panel-casos"></section>
  <!-- SIMULACRO -->
  <section class="panel" id="panel-simulacro"></section>
  <!-- PROGRESO -->
  <section class="panel" id="panel-progreso"></section>
  <!-- FLASHCARDS -->
  <section class="panel" id="panel-flashcards"></section>
  <!-- GLOSARIO -->
  <section class="panel" id="panel-glosario"></section>
  <!-- SERVICIOS -->
  <section class="panel" id="panel-servicios"></section>
  <!-- COMPARADOR -->
  <section class="panel" id="panel-comparador"></section>
</main>

<footer id="appFooter"></footer>

<script>
window.EXAM_META = {
  id: "cloud-practitioner",
  slug: "guia-cloud-practitioner",
  codigo: "CLF-C02",
  nombre: "Cloud Practitioner",
  nombreCompleto: "AWS Certified Cloud Practitioner (CLF-C02)",
  comparadorTitulo: "Comparador de servicios de AWS",
  comparadorTabLabel: "Comparador"
};
</script>
<script src="exams/cloud-practitioner/data.js"></script>
<script src="shared/app.js"></script>
</body>
</html>
