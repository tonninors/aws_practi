<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía interactiva · AWS Certified AI Practitioner (AIF-C01)</title>
<style>
  :root{
    --ink:#232F3E;        /* Squid Ink */
    --ink2:#2d3b4d;
    --orange:#FF9900;     /* Smile Orange */
    --orange-d:#e88a00;
    --bg:#f4f6f9;
    --card:#ffffff;
    --line:#e3e8ef;
    --text:#1b2530;
    --muted:#5c6b7a;
    --green:#127a3e;
    --green-bg:#e7f6ec;
    --red:#c0392b;
    --red-bg:#fdecea;
    --blue:#146eb4;       /* AWS blue */
    --shadow:0 2px 10px rgba(35,47,62,.08);
    --shadow-h:0 8px 24px rgba(35,47,62,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--blue)}
  /* Header */
  header.top{
    background:linear-gradient(120deg,var(--ink) 0%,var(--ink2) 100%);
    color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 12px rgba(0,0,0,.18);
  }
  .top-inner{max-width:1080px;margin:0 auto;padding:14px 18px 0}
  .brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand .logo{
    background:var(--orange);color:var(--ink);font-weight:800;border-radius:8px;
    padding:6px 10px;font-size:14px;letter-spacing:.5px;white-space:nowrap
  }
  .brand h1{font-size:18px;margin:0;font-weight:650}
  .brand .sub{color:#c7d0da;font-size:12.5px;margin-left:auto}
  nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:thin}
  nav.tabs button{
    background:transparent;border:0;color:#c7d0da;font-size:14px;font-weight:600;
    padding:10px 14px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;
    border-bottom:3px solid transparent;transition:.15s;
  }
  nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.06)}
  nav.tabs button.active{color:#fff;border-bottom-color:var(--orange);background:rgba(255,153,0,.12)}
  /* Layout */
  main{max-width:1080px;margin:0 auto;padding:22px 18px 80px}
  .panel{display:none;animation:fade .25s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  h2.section{font-size:22px;margin:2px 0 4px;color:var(--ink)}
  p.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
  /* Inicio */
  .hero{display:grid;grid-template-columns:1fr;gap:16px}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:26px;color:var(--orange-d);line-height:1.1}
  .stat span{font-size:12.5px;color:var(--muted)}
  table.weights{width:100%;border-collapse:collapse;margin-top:6px}
  table.weights th,table.weights td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}
  table.weights th{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
  .bar{height:10px;background:#eef1f5;border-radius:6px;overflow:hidden;min-width:90px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-d))}
  .progress-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .ring{--p:0;width:96px;height:96px;border-radius:50%;
    background:conic-gradient(var(--orange) calc(var(--p)*1%),#e9edf2 0);
    display:grid;place-items:center;flex:none}
  .ring>div{width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
  .ring b{font-size:20px;color:var(--ink)}
  .ring small{font-size:10.5px;color:var(--muted)}
  .btn{background:var(--orange);color:var(--ink);border:0;border-radius:9px;padding:10px 16px;
    font-weight:700;font-size:14px;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
  .btn:hover{background:var(--orange-d);color:#fff;transform:translateY(-1px)}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn.ghost:hover{background:#f0f2f6;color:var(--ink);transform:none}
  .btn.blue{background:var(--blue);color:#fff}
  .btn.blue:hover{background:#0f588f}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  /* Repaso (accordion) */
  .domain-head{display:flex;align-items:center;gap:12px;margin:22px 0 8px}
  .domain-head .pill{background:var(--ink);color:#fff;border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:700;flex:none}
  .domain-head h3{margin:0;font-size:17px;color:var(--ink)}
  .domain-head .w{margin-left:auto;font-size:12.5px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:3px 9px;border-radius:20px;flex:none}
  .acc{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
  .acc>button{width:100%;text-align:left;background:none;border:0;padding:14px 16px;cursor:pointer;
    display:flex;align-items:center;gap:10px;font-size:15px;font-weight:650;color:var(--ink)}
  .acc>button .tno{background:var(--orange);color:var(--ink);border-radius:6px;font-size:12px;font-weight:800;padding:2px 7px;flex:none}
  .acc>button .chev{margin-left:auto;transition:.2s;color:var(--muted);flex:none}
  .acc.open>button .chev{transform:rotate(180deg)}
  .acc .body{display:none;padding:2px 18px 16px 18px;border-top:1px solid var(--line)}
  .acc.open .body{display:block}
  .acc .body ul{margin:12px 0 6px;padding-left:20px}
  .acc .body li{margin:6px 0;font-size:14.5px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{background:#eef4fb;color:var(--blue);border:1px solid #d6e6f6;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}
  /* Preguntas */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
  .chip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);transition:.15s}
  .chip:hover{border-color:var(--orange)}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
  .q .meta{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .q .meta .d{background:#eef4fb;color:var(--blue);font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px}
  .q .meta .ty{background:#f3eefb;color:#6b3fb0;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px}
  .q .meta .st{margin-left:auto;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px}
  .q .meta .st.ok{background:var(--green-bg);color:var(--green)}
  .q .meta .st.no{background:var(--red-bg);color:var(--red)}
  .q .stem{font-size:15.5px;font-weight:600;margin:2px 0 12px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;transition:.12s;font-size:14.5px;background:#fff}
  .opt:hover{border-color:var(--orange);background:#fffdf7}
  .opt .box{width:20px;height:20px;border:2px solid #b9c2cd;border-radius:5px;flex:none;display:grid;place-items:center;margin-top:1px;font-size:12px;color:#fff;font-weight:800}
  .opt.radio .box{border-radius:50%}
  .opt.sel{border-color:var(--orange);background:#fff8ec}
  .opt.sel .box{background:var(--orange);border-color:var(--orange-d)}
  .opt.correct{border-color:var(--green);background:var(--green-bg)}
  .opt.correct .box{background:var(--green);border-color:var(--green)}
  .opt.wrong{border-color:var(--red);background:var(--red-bg)}
  .opt.wrong .box{background:var(--red);border-color:var(--red)}
  .opt.locked{cursor:default}
  .q .actions{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .explain{margin-top:12px;border-left:4px solid var(--orange);background:#fff8ec;border-radius:8px;padding:11px 14px;font-size:14px;display:none}
  .explain.show{display:block}
  .explain b{color:var(--orange-d)}
  /* Flashcards */
  .fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .fc{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    min-height:150px;cursor:pointer;perspective:1000px}
  .fc-inner{position:relative;width:100%;height:100%;min-height:150px;transition:transform .5s;transform-style:preserve-3d}
  .fc.flip .fc-inner{transform:rotateY(180deg)}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;padding:16px;display:grid;place-items:center;text-align:center;border-radius:14px}
  .fc-front{font-weight:700;color:var(--ink);font-size:15.5px}
  .fc-back{transform:rotateY(180deg);background:var(--ink);color:#fff;font-size:13.5px;line-height:1.5}
  .fc-front small{position:absolute;bottom:8px;left:0;right:0;color:var(--muted);font-weight:500;font-size:11px}
  /* Glosario / servicios */
  .glos dt{font-weight:700;color:var(--ink);margin-top:14px;font-size:15px}
  .glos dt .en{color:var(--muted);font-weight:500;font-size:12.5px}
  .glos dd{margin:3px 0 0;color:var(--text);font-size:14px}
  table.svc{width:100%;border-collapse:collapse}
  table.svc th,table.svc td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
  table.svc th{position:sticky;top:104px;background:#fff}
  table.svc td.name{font-weight:700;color:var(--ink);white-space:nowrap}
  .cat-row td{background:var(--ink);color:#fff;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px}
  /* Simulacro */
  .sim-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:104px;z-index:10;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);margin-bottom:16px}
  .sim-bar .timer{font-weight:800;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
  .sim-bar .count{color:var(--muted);font-size:13.5px}
  .result-score{font-size:52px;font-weight:800;line-height:1}
  .result-score.pass{color:var(--green)}
  .result-score.fail{color:var(--red)}
  .verdict{font-size:18px;font-weight:800;margin-top:4px}
  .verdict.pass{color:var(--green)}
  .verdict.fail{color:var(--red)}
  .dom-break{display:grid;gap:8px;margin-top:14px}
  .dom-break .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:13.5px}
  .note{font-size:12.5px;color:var(--muted)}
  .callout{background:#eef4fb;border:1px solid #d6e6f6;border-radius:10px;padding:12px 14px;font-size:13.5px;color:#0f4c78;margin-bottom:16px}
  footer{max-width:1080px;margin:0 auto;padding:0 18px 40px;color:var(--muted);font-size:12.5px;text-align:center}
  @media (max-width:720px){
    .stat-row{grid-template-columns:repeat(2,1fr)}
    .brand .sub{display:none}
    table.svc th{top:96px}
    .sim-bar{top:96px}
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="logo">AWS · AIF-C01</span>
      <h1>Guía interactiva · AI Practitioner</h1>
      <span class="sub" id="miniProgress">Progreso: 0%</span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="inicio" class="active">Inicio</button>
      <button data-tab="repaso">Repaso por dominio</button>
      <button data-tab="preguntas">Banco de preguntas</button>
      <button data-tab="simulacro">Simulacro</button>
      <button data-tab="flashcards">Flashcards</button>
      <button data-tab="glosario">Glosario</button>
      <button data-tab="servicios">Servicios AWS</button>
    </nav>
  </div>
</header>

<main>
  <!-- INICIO -->
  <section class="panel active" id="panel-inicio"></section>
  <!-- REPASO -->
  <section class="panel" id="panel-repaso"></section>
  <!-- PREGUNTAS -->
  <section class="panel" id="panel-preguntas"></section>
  <!-- SIMULACRO -->
  <section class="panel" id="panel-simulacro"></section>
  <!-- FLASHCARDS -->
  <section class="panel" id="panel-flashcards"></section>
  <!-- GLOSARIO -->
  <section class="panel" id="panel-glosario"></section>
  <!-- SERVICIOS -->
  <section class="panel" id="panel-servicios"></section>
</main>

<footer>
  Guía de estudio no oficial basada en la Guía de examen oficial AWS Certified AI Practitioner (AIF-C01).
  Úsala como complemento de repaso. ¡Mucho éxito en tu examen! 🚀
</footer>

<script>
/* ============================================================
   DATOS
   ============================================================ */
const DOMINIOS = [
  {
    id:"1", peso:20, titulo:"Aspectos básicos de la IA y el ML",
    tareas:[
      { id:"1.1", titulo:"Explicar la terminología y los conceptos básicos de la IA",
        puntos:[
          "<b>IA ⊃ ML ⊃ Deep Learning</b>. La IA es el campo amplio; el ML aprende patrones a partir de datos; el aprendizaje profundo (deep learning) usa redes neuronales de muchas capas. La <b>GenAI</b> (subconjunto del DL) crea contenido nuevo; la <b>IA agéntica</b> usa modelos que planifican y ejecutan acciones con herramientas de forma autónoma.",
          "<b>Conceptos base:</b> red neuronal, visión artificial (computer vision), NLP (procesamiento de lenguaje natural), modelo (lo aprendido) vs algoritmo (cómo aprende), <b>entrenamiento</b> (aprender de datos) vs <b>inferencia</b> (usar el modelo para predecir), sesgo/equidad, <b>LLM</b> (modelo de lenguaje de gran tamaño).",
          "<b>Tipos de inferencia:</b> por <b>lotes</b> (batch, grandes volúmenes sin urgencia), en <b>tiempo real</b> (baja latencia, síncrona), <b>asíncrona</b> (cargas grandes/colas) y <b>sin servidor</b> (serverless, escala automática y paga por uso).",
          "<b>Tipos de datos:</b> etiquetados vs sin etiquetar; tabulares; series temporales; imágenes; texto; y <b>estructurados</b> (tablas) vs <b>no estructurados</b> (texto, imágenes, audio).",
          "<b>Tipos de aprendizaje:</b> <b>supervisado</b> (datos etiquetados → clasificación/regresión), <b>no supervisado</b> (sin etiquetas → clustering, reducción de dimensionalidad) y por <b>refuerzo</b> (agente aprende por recompensas/penalizaciones)."
        ], servicios:[] },
      { id:"1.2", titulo:"Identificar casos de uso prácticos de la IA",
        puntos:[
          "<b>Cuándo aporta valor la IA/ML:</b> apoyar la toma de decisiones, escalar soluciones y automatizar tareas repetitivas o de gran volumen.",
          "<b>Cuándo NO conviene:</b> cuando un análisis costo-beneficio no lo justifica, o cuando se necesita un <b>resultado exacto y determinístico</b> (reglas fijas) en lugar de una predicción probabilística.",
          "<b>Técnicas por caso:</b> <b>regresión</b> (predecir un número continuo), <b>clasificación</b> (predecir una categoría) y <b>clustering</b> (agrupar datos sin etiquetas).",
          "<b>Aplicaciones del mundo real:</b> visión artificial, NLP, reconocimiento de voz, sistemas de recomendación, detección de fraude, pronósticos (forecasting), bases de conocimiento e IA agéntica.",
          "<b>Servicios de IA administrados de AWS:</b> <b>SageMaker AI</b> (crear/entrenar/desplegar), <b>Transcribe</b> (voz→texto), <b>Translate</b> (traducción), <b>Comprehend</b> (NLP: sentimiento, entidades), <b>Lex</b> (chatbots/voz), <b>Polly</b> (texto→voz).",
          "<b>ML tradicional vs FM:</b> elige ML tradicional cuando necesitas explicabilidad, control regulatorio o un modelo pequeño y específico; elige FM/GenAI para lenguaje natural, generación de contenido y tareas amplias."
        ], servicios:["SageMaker AI","Transcribe","Translate","Comprehend","Amazon Lex","Amazon Polly"] },
      { id:"1.3", titulo:"Describir el ciclo de vida de desarrollo de IA/ML",
        puntos:[
          "<b>Canalización (pipeline) de ML:</b> recopilación de datos → preparación/procesamiento → ingeniería de características → entrenamiento → evaluación → despliegue → monitoreo/reentrenamiento.",
          "<b>Fuentes de FM:</b> modelos preentrenados de código abierto/comerciales y modelos personalizados entrenados desde cero.",
          "<b>Modelo en producción:</b> mediante <b>API administrada</b> (p. ej. Amazon Bedrock: sin gestionar infraestructura) o <b>API autoalojada</b> (más control, más operación).",
          "<b>Servicios por etapa:</b> <b>Bedrock</b> (FM vía API), <b>SageMaker AI</b> (ciclo ML completo), <b>Amazon Q</b> (asistente GenAI).",
          "<b>MLOps:</b> experimentación, procesos repetibles, sistemas escalables, gestión de deuda técnica, preparación para producción, y <b>monitoreo + reentrenamiento</b> de modelos.",
          "<b>Métricas de modelo:</b> exactitud (accuracy), precisión (precision), exhaustividad (recall) y <b>F1</b>. <b>Métricas de negocio:</b> costo por usuario, costos de desarrollo, satisfacción del cliente y ROI."
        ], servicios:["Amazon Bedrock","SageMaker AI","Amazon Q"] }
    ]
  },
  {
    id:"2", peso:24, titulo:"Aspectos básicos de la IA generativa",
    tareas:[
      { id:"2.1", titulo:"Explicar los conceptos básicos de la IA generativa (GenAI)",
        puntos:[
          "<b>Conceptos base:</b> <b>tokens</b> (unidades de texto), <b>fragmentación</b> (chunking), <b>embeddings</b> (representaciones numéricas del significado), <b>vectores</b>, ingeniería de peticiones, <b>LLM basados en transformadores</b>, <b>FM</b> (modelos fundacionales), modelos <b>multimodales</b> (texto+imagen+audio) y modelos de <b>difusión</b> (generan imágenes).",
          "<b>Casos de uso:</b> generación de imágenes/video/audio, resúmenes, asistentes de IA, traducción, generación de código, agentes de servicio al cliente, búsqueda de información y motores de recomendación.",
          "<b>Ciclo de vida de un FM:</b> selección de datos → selección del modelo → preentrenamiento → refinamiento (fine-tuning) → evaluación → implementación → retroalimentación.",
          "<b>Precios basados en tokens:</b> se paga por tokens de entrada + salida; más tokens = mayor costo y latencia. Optimizar el tamaño del prompt reduce costo.",
          "<b>Ingeniería de contexto:</b> proporcionar el contexto adecuado (documentos, instrucciones, ejemplos) para que el FM responda mejor.",
          "<b>IA entre agentes (multiagente):</b> patrones multiagente para tareas complejas, el <b>MCP (Model Context Protocol)</b> para conectar agentes a sistemas externos, comunicación entre agentes, gestión de memoria, uso de herramientas y orquestación de flujos."
        ], servicios:["Amazon Bedrock"] },
      { id:"2.2", titulo:"Capacidades y limitaciones de la GenAI para problemas empresariales",
        puntos:[
          "<b>Ventajas:</b> adaptabilidad, capacidad de respuesta, capacidades de conversación y capacidad de generar contenido nuevo.",
          "<b>Desventajas:</b> <b>alucinaciones</b> (información inventada pero plausible), baja interpretabilidad, inexactitud y falta de <b>determinismo</b> (la misma entrada puede dar salidas distintas).",
          "<b>Factores para seleccionar un modelo:</b> tipo de modelo, requisitos de desempeño, capacidades, restricciones, cumplimiento, costo, latencia y complejidad del modelo.",
          "<b>Valor empresarial y métricas:</b> desempeño entre dominios, ROI, eficiencia, tasa de conversión, ingresos promedio por usuario (ARPU), exactitud y valor del ciclo de vida del cliente (CLV)."
        ], servicios:[] },
      { id:"2.3", titulo:"Infraestructura y tecnologías de AWS para GenAI",
        puntos:[
          "<b>Servicios para construir GenAI:</b> <b>Amazon Bedrock</b> (FM vía API), <b>SageMaker AI</b>, <b>SageMaker JumpStart</b> (modelos preconstruidos), <b>Amazon Q</b> (asistente), <b>Strands Agents</b> y <b>Amazon Bedrock AgentCore</b> (agentes).",
          "<b>Ventajas de los servicios GenAI de AWS:</b> accesibilidad, menor barrera de entrada, eficiencia, rentabilidad, velocidad de comercialización (time-to-market) y capacidad para cumplir objetivos empresariales.",
          "<b>Beneficios de la infraestructura de AWS:</b> seguridad, cumplimiento, responsabilidad y protección de datos.",
          "<b>Ventajas y desventajas a considerar:</b> capacidad de respuesta, disponibilidad, redundancia, rendimiento, cobertura regional, precios por tokens, <b>rendimiento aprovisionado</b> (provisioned throughput) y modelos personalizados."
        ], servicios:["Amazon Bedrock","SageMaker AI","SageMaker JumpStart","Amazon Q","Bedrock AgentCore"] }
    ]
  },
  {
    id:"3", peso:28, titulo:"Aplicaciones de los modelos fundacionales",
    tareas:[

/* ============================================================
   ESTADO Y PERSISTENCIA
   ============================================================ */
const LS_KEY = "aifc01_progress_v1";
let progreso = cargarProgreso();
function cargarProgreso(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; }
}
function guardarProgreso(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(progreso)); }catch(e){}
}
function registrar(qid, ok){
  progreso[qid] = ok ? "ok" : "no";
  guardarProgreso();
  actualizarMiniProgreso();
}
function statsProgreso(){
  const total = PREGUNTAS.length;
  const respondidas = Object.keys(progreso).filter(k=>PREGUNTAS.some(q=>q.id===k)).length;
  const correctas = Object.entries(progreso).filter(([k,v])=>v==="ok" && PREGUNTAS.some(q=>q.id===k)).length;
  return {total, respondidas, correctas, pct: total? Math.round(respondidas/total*100):0};
}
function actualizarMiniProgreso(){
  const s = statsProgreso();
  const el = document.getElementById("miniProgress");
  if(el) el.textContent = `Progreso: ${s.pct}% (${s.correctas}/${s.total} correctas)`;
  const ini = document.getElementById("panel-inicio");
  if(ini && ini.classList.contains("active")) renderInicio();
}

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
const tabs = document.getElementById("tabs");
tabs.addEventListener("click", e=>{
  const b = e.target.closest("button[data-tab]");
  if(!b) return;
  activarTab(b.dataset.tab);
});
function activarTab(tab){
  document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.toggle("active", x.dataset.tab===tab));
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  const panel = document.getElementById("panel-"+tab);
  panel.classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
  if(tab==="inicio") renderInicio();
  if(tab==="repaso") renderRepaso();
  if(tab==="preguntas") renderPreguntas();
  if(tab==="flashcards") renderFlashcards();
  if(tab==="glosario") renderGlosario();
  if(tab==="servicios") renderServicios();
  if(tab==="simulacro") renderSimulacroInicio();
}

/* ============================================================
   BANCO DE PREGUNTAS
   ============================================================ */
let filtroDominio = "todos";
function renderPreguntas(){
  const el = document.getElementById("panel-preguntas");
  const lista = filtroDominio==="todos" ? PREGUNTAS : PREGUNTAS.filter(q=>q.dominio===filtroDominio);
  el.innerHTML = `
    <h2 class="section">Banco de preguntas</h2>
    <p class="lead">Responde y pulsa “Comprobar” para ver la retroalimentación y la explicación. Tu progreso se guarda automáticamente.</p>
    <div class="filters">
      <span class="chip ${filtroDominio==='todos'?'active':''}" onclick="setFiltro('todos')">Todos (${PREGUNTAS.length})</span>
      ${DOMINIOS.map(d=>`<span class="chip ${filtroDominio===d.id?'active':''}" onclick="setFiltro('${d.id}')">D${d.id} (${PREGUNTAS.filter(q=>q.dominio===d.id).length})</span>`).join("")}
    </div>
    <div id="qlist">${lista.map(q=>tarjetaPregunta(q)).join("")}</div>
  `;
  lista.forEach(q=>{ if(progreso[q.id]) repintarResuelta(q.id); });
}
function setFiltro(d){ filtroDominio=d; renderPreguntas(); }
function tipoLabel(t){ return t==="multi" ? "Respuesta múltiple" : "Opción múltiple"; }
function tarjetaPregunta(q){
  const multi = q.tipo==="multi";
  return `<div class="q" id="q-${q.id}" data-tipo="${q.tipo}">
    <div class="meta">
      <span class="d">Dominio ${q.dominio} · ${q.tarea}</span>
      <span class="ty">${tipoLabel(q.tipo)}</span>
      <span class="st" id="st-${q.id}" style="display:none"></span>
    </div>
    <div class="stem">${q.stem}</div>
    <div class="opts" id="opts-${q.id}">
      ${q.opciones.map((o,i)=>`
        <div class="opt ${multi?'':'radio'}" data-i="${i}" onclick="toggleOpt('${q.id}',${i},${multi})">
          <span class="box"></span><span>${o}</span>
        </div>`).join("")}
    </div>
    <div class="actions">
      <button class="btn" id="chk-${q.id}" onclick="comprobar('${q.id}')">Comprobar</button>
      <button class="btn ghost" onclick="reiniciarPregunta('${q.id}')">Reintentar</button>
    </div>
    <div class="explain" id="ex-${q.id}"><b>Explicación:</b> </div>
  </div>`;
}
const seleccion = {}; // qid -> Set(idx)
function toggleOpt(qid, i, multi){
  const cont = document.getElementById("q-"+qid);
  if(cont.classList.contains("resuelta")) return;
  if(!seleccion[qid]) seleccion[qid]=new Set();
  const set = seleccion[qid];
  if(multi){
    set.has(i)?set.delete(i):set.add(i);
  }else{
    set.clear(); set.add(i);
  }
  cont.querySelectorAll(".opt").forEach(op=>{
    op.classList.toggle("sel", set.has(+op.dataset.i));
  });
}
function comprobar(qid){
  const q = PREGUNTAS.find(x=>x.id===qid);
  const set = seleccion[qid] || new Set();
  if(set.size===0){ alert("Selecciona al menos una opción."); return; }
  const cont = document.getElementById("q-"+qid);
  cont.classList.add("resuelta");
  const correctas = new Set(q.correctas);
  let ok = set.size===correctas.size && [...set].every(i=>correctas.has(i));
  cont.querySelectorAll(".opt").forEach(op=>{
    const i = +op.dataset.i;
    op.classList.add("locked");
    if(correctas.has(i)) op.classList.add("correct");
    else if(set.has(i)) op.classList.add("wrong");
    op.classList.remove("sel");
    const box = op.querySelector(".box");
    if(correctas.has(i)) box.textContent="✓";
    else if(set.has(i)) box.textContent="✗";
  });
  const st = document.getElementById("st-"+qid);
  st.style.display="inline-block";
  st.className = "st "+(ok?"ok":"no");
  st.textContent = ok ? "Correcto" : "Incorrecto";
  const ex = document.getElementById("ex-"+qid);
  ex.innerHTML = "<b>Explicación:</b> "+q.explain;
  ex.classList.add("show");
  document.getElementById("chk-"+qid).disabled = true;
  registrar(qid, ok);
}
function reiniciarPregunta(qid){
  seleccion[qid]=new Set();
  const cont = document.getElementById("q-"+qid);
  cont.classList.remove("resuelta");
  cont.querySelectorAll(".opt").forEach(op=>{
    op.className = "opt "+(cont.dataset.tipo==="multi"?"":"radio");
    op.querySelector(".box").textContent="";
  });
  document.getElementById("st-"+qid).style.display="none";
  document.getElementById("ex-"+qid).classList.remove("show");
  document.getElementById("chk-"+qid).disabled=false;
}
function repintarResuelta(qid){
  // Marca visualmente el estado guardado (correcto/incorrecto) sin las opciones concretas
  const st = document.getElementById("st-"+qid);
  if(!st) return;
  const v = progreso[qid];
  st.style.display="inline-block";
  st.className="st "+(v==="ok"?"ok":"no");
  st.textContent = v==="ok" ? "Ya respondida ✓" : "Ya respondida ✗";
}

/* ============================================================
   SIMULACRO
   ============================================================ */
let sim = null;
function renderSimulacroInicio(){
  const el = document.getElementById("panel-simulacro");
  if(sim && sim.enCurso){ renderSimulacroPreguntas(); return; }
  const n = Math.min(50, PREGUNTAS.length);
  el.innerHTML = `
    <h2 class="section">Simulacro de examen</h2>
    <p class="lead">Un examen de práctica con ${n} preguntas seleccionadas al azar, cronómetro y puntaje escalado 100–1000 (aprobación ≥700), igual que el examen real. No verás la retroalimentación hasta terminar.</p>
    <div class="card">
      <h3 style="margin:0 0 8px;color:var(--ink)">¿List@ para empezar?</h3>
      <ul style="margin:0 0 14px;color:var(--muted);font-size:14px">
        <li>${n} preguntas al azar de los 5 dominios.</li>
        <li>Cronómetro de referencia (90 minutos).</li>
        <li>Al final: puntaje escalado, veredicto y desglose por dominio.</li>
      </ul>
      <button class="btn" onclick="iniciarSimulacro()">Iniciar simulacro</button>
    </div>
  `;
}
function iniciarSimulacro(){
  const n = Math.min(50, PREGUNTAS.length);
  const barajado = [...PREGUNTAS].sort(()=>Math.random()-0.5).slice(0,n);
  sim = { preguntas:barajado, respuestas:{}, enCurso:true, inicio:Date.now(), limite:90*60 };
  seleccion._sim = {};
  renderSimulacroPreguntas();
  iniciarTimer();
}
let timerInt = null;
function iniciarTimer(){
  clearInterval(timerInt);
  timerInt = setInterval(()=>{
    if(!sim || !sim.enCurso){ clearInterval(timerInt); return; }
    const trans = Math.floor((Date.now()-sim.inicio)/1000);
    const rest = sim.limite - trans;
    const t = document.getElementById("sim-timer");
    if(t){
      if(rest<=0){ t.textContent="00:00"; finalizarSimulacro(); return; }
      const m = String(Math.floor(rest/60)).padStart(2,"0");
      const s = String(rest%60).padStart(2,"0");
      t.textContent = `${m}:${s}`;
    }
  },1000);
}
function renderSimulacroPreguntas(){
  const el = document.getElementById("panel-simulacro");
  el.innerHTML = `
    <div class="sim-bar">
      <span class="timer" id="sim-timer">90:00</span>
      <span class="count">Respondidas: <b id="sim-count">0</b>/${sim.preguntas.length}</span>
      <button class="btn blue" style="margin-left:auto" onclick="finalizarSimulacro()">Terminar y ver resultado</button>
    </div>
    ${sim.preguntas.map((q,idx)=>{
      const multi = q.tipo==="multi";
      return `<div class="q" id="sq-${q.id}">
        <div class="meta"><span class="d">Pregunta ${idx+1} · Dominio ${q.dominio}</span><span class="ty">${tipoLabel(q.tipo)}</span></div>
        <div class="stem">${q.stem}</div>
        <div class="opts">
          ${q.opciones.map((o,i)=>`<div class="opt ${multi?'':'radio'}" data-i="${i}" onclick="simSel('${q.id}',${i},${multi})"><span class="box"></span><span>${o}</span></div>`).join("")}
        </div>
      </div>`;
    }).join("")}
    <div style="text-align:center;margin-top:8px">
      <button class="btn blue" onclick="finalizarSimulacro()">Terminar y ver resultado</button>
    </div>
  `;
}
function simSel(qid,i,multi){
  if(!sim.respuestas[qid]) sim.respuestas[qid]=new Set();
  const set = sim.respuestas[qid];
  if(multi){ set.has(i)?set.delete(i):set.add(i); } else { set.clear(); set.add(i); }
  if(set.size===0) delete sim.respuestas[qid];
  const cont = document.getElementById("sq-"+qid);
  cont.querySelectorAll(".opt").forEach(op=>op.classList.toggle("sel", set.has(+op.dataset.i)));
  document.getElementById("sim-count").textContent = Object.keys(sim.respuestas).length;
}
function finalizarSimulacro(){
  if(!sim || !sim.enCurso) return;
  if(Object.keys(sim.respuestas).length < sim.preguntas.length){
    if(!confirm("Aún tienes preguntas sin responder (contarán como incorrectas). ¿Terminar de todos modos?")) return;
  }
  sim.enCurso=false; clearInterval(timerInt);
  let correctas=0; const porDom={};
  DOMINIOS.forEach(d=>porDom[d.id]={ok:0,total:0});
  sim.preguntas.forEach(q=>{
    porDom[q.dominio].total++;
    const set = sim.respuestas[q.id] || new Set();
    const cor = new Set(q.correctas);
    const ok = set.size===cor.size && [...set].every(i=>cor.has(i));
    if(ok){ correctas++; porDom[q.dominio].ok++; }
    registrar(q.id, ok);
  });
  const total = sim.preguntas.length;
  const ratio = correctas/total;
  const escala = Math.round(100 + ratio*900); // 100–1000
  const aprob = escala>=700;
  const trans = Math.floor((Date.now()-sim.inicio)/1000);
  const mm = String(Math.floor(trans/60)).padStart(2,"0"), ss=String(trans%60).padStart(2,"0");
  const el = document.getElementById("panel-simulacro");
  el.innerHTML = `
    <h2 class="section">Resultado del simulacro</h2>
    <div class="card" style="text-align:center">
      <div class="result-score ${aprob?'pass':'fail'}">${escala}</div>
      <div class="verdict ${aprob?'pass':'fail'}">${aprob?'APROBADO ✓':'REPROBADO ✗'}</div>
      <p class="note">Acertaste <b>${correctas}</b> de <b>${total}</b> (${Math.round(ratio*100)}%). Puntaje mínimo para aprobar: 700. Tiempo: ${mm}:${ss}.</p>
      <div class="dom-break">
        ${DOMINIOS.map(d=>{
          const p=porDom[d.id]; const pc = p.total? Math.round(p.ok/p.total*100):0;
          return `<div class="row"><div>D${d.id} · ${d.titulo}</div><div><div class="bar" style="width:120px;display:inline-block;vertical-align:middle"><i style="width:${pc}%"></i></div> <b>${p.ok}/${p.total}</b></div></div>`;
        }).join("")}
      </div>
      <div style="margin-top:18px">
        <button class="btn" onclick="iniciarSimulacro()">Repetir simulacro</button>
        <button class="btn ghost" onclick="renderSimulacroInicio()">Volver</button>
      </div>
    </div>
    ${aprob?'<div class="callout">🎉 ¡Buen trabajo! Repasa igualmente las preguntas que fallaste en el Banco de preguntas.</div>':'<div class="callout">📚 Sigue repasando los dominios con menor puntaje y vuelve a intentarlo. ¡Tú puedes!</div>'}
  `;
  window.scrollTo({top:0,behavior:"smooth"});
}
